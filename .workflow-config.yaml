# AI Workflow Automation Configuration
# Project: ai_workflow.js

project:
  name: 'ai_workflow.js'
  type: 'nodejs-application'
  description: 'JavaScript/Node.js migration of AI workflow automation system'
  kind: 'nodejs_automation'
  version: '2.2.2'

tech_stack:
  primary_language: 'javascript'
  secondary_languages:
    - 'typescript'
  build_system: 'npm'
  test_framework: 'jest'
  test_command: 'npm test'
  lint_command: 'npm run lint'
  # step_10 reads lint_commands (plural keyed map) to drive per-language linting
  lint_commands:
    javascript: 'npm run lint'
    typescript: 'npm run lint'

structure:
  source_dirs:
    - src
  test_dirs:
    - test
  docs_dirs:
    - docs

# step_16 reads version.config_files to know which files to version-bump
version:
  config_files:
    - package.json

# step_16 reads skills.version_sync to run a project-specific version-sync hook
skills:
  version_sync:
    command: 'npm run validate'
    check_command: 'npm run validate:versions'
    description: 'Validate version consistency across package.json and source files'

# Workflow execution settings (template v4.0.0+)
workflow:
  settings:
    auto_mode: false # skip interactive prompts
    parallel_execution: true # run independent steps in parallel
    smart_execution: true # skip steps based on change detection
    ml_optimize: false # use ML-driven step optimization
    multi_stage: false # progressive validation pipeline
    auto_commit: false # automatically commit workflow artifacts
