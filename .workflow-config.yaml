# AI Workflow Automation Configuration
# Project: ai_workflow.js

project:
  name: 'ai_workflow.js'
  type: 'nodejs-application'
  description: 'AI-powered workflow automation for software development projects with GitHub Copilot integration'
  kind: 'nodejs_automation'
  version: '2.6.0'

tech_stack:
  primary_language: 'javascript'
  secondary_languages:
    - 'typescript'
  build_system: 'npm'
  test_framework: 'jest'
  test_command: 'npm test'
  lint_command: 'npm run lint'
  # step_10 reads lint_commands (plural keyed map) to drive per-language linting
  lint_commands:
    javascript: 'npm run lint'
    typescript: 'npm run lint'

structure:
  source_dirs:
    - src
  test_dirs:
    - test
  docs_dirs:
    - docs

# step_16 reads version.config_files for JS/TS files that export VERSION + BUILD_DATE
version:
  config_files: []

# step_16 reads skills.version_sync to run a project-specific version-sync hook
skills:
  version_sync:
    command: 'npm run validate'
    check_command: 'npm run validate:versions'
    description: 'Validate version consistency across package.json and source files'

# Workflow execution settings (template v4.0.0+)
workflow:
  settings:
    auto_mode: false # skip interactive prompts
    parallel_execution: true # run independent steps in parallel
    smart_execution: true # skip steps based on change detection
    ml_optimize: false # use ML-driven step optimization
    multi_stage: false # progressive validation pipeline
    auto_commit: false # automatically commit workflow artifacts
  steps:
    - id: step_00
      name: 'Pre-Analysis'
      description: 'Analyze git state and project context'
      enabled: true
      dependencies: []

    - id: step_0b
      name: 'Bootstrap Documentation'
      description: 'Generate initial documentation'
      enabled: true
      dependencies:
        - step_00

    - id: step_01
      name: 'Documentation Updates'
      description: 'Validate and update documentation'
      enabled: true
      dependencies:
        - step_0b

    - id: step_01_5
      name: 'Copilot Instructions Validation'
      description: 'Audit and refresh .github/copilot-instructions.md against live repo facts'
      enabled: true
      dependencies:
        - step_01

    - id: step_02
      name: 'Consistency Analysis'
      description: 'Check code and documentation consistency'
      enabled: true
      dependencies:
        - step_01_5

    - id: step_02_5
      name: 'Documentation Optimization'
      description: 'Optimize documentation size and quality'
      enabled: true
      dependencies:
        - step_02

    - id: step_21
      name: 'Doc Consolidation'
      description: 'Find similar markdown docs and merge them into canonical documents'
      enabled: true
      dependencies:
        - step_02_5

    - id: step_03
      name: 'Script References'
      description: 'Validate script references'
      enabled: true
      dependencies:
        - step_02

    - id: step_04
      name: 'Configuration Validation'
      description: 'Validate project configuration'
      enabled: true
      dependencies:
        - step_00

    - id: step_05
      name: 'Directory Structure'
      description: 'Validate directory structure'
      enabled: true
      dependencies:
        - step_04

    - id: step_06
      name: 'Test Review'
      description: 'Review existing tests'
      enabled: true
      dependencies:
        - step_05

    - id: step_07
      name: 'Test Generation'
      description: 'Generate new tests'
      enabled: true
      dependencies:
        - step_06

    - id: step_08
      name: 'Test Execution'
      description: 'Execute test suite'
      enabled: true
      dependencies:
        - step_07

    - id: step_09
      name: 'Dependency Analysis'
      description: 'Analyze and validate dependencies'
      enabled: true
      dependencies:
        - step_08

    - id: step_10
      name: 'Code Quality'
      description: 'Analyze code quality'
      enabled: true
      dependencies:
        - step_09

    - id: step_13
      name: 'Markdown Linting'
      description: 'Lint markdown files'
      enabled: true
      dependencies:
        - step_10

    - id: step_11
      name: 'Context Management'
      description: 'Manage workflow context'
      enabled: true
      dependencies:
        - step_13

    - id: step_11_5
      name: 'AWS LBS Validation'
      description: 'Validate aws_lbs_backend_setup projects: shell scripts, Lambda structure, AWS config'
      enabled: true
      dependencies:
        - step_11

    - id: step_11_6
      name: 'AWS Serverless AI Review'
      description: 'AI-powered deployment readiness review for aws_lbs_backend_setup projects'
      enabled: true
      dependencies:
        - step_11_5

    - id: step_14
      name: 'Prompt Engineering'
      description: 'Analyze and optimize AI prompts'
      enabled: true
      dependencies:
        - step_13

    - id: step_15
      name: 'UX Analysis'
      description: 'Analyze UX and accessibility'
      enabled: true
      dependencies:
        - step_14

    - id: step_16
      name: 'Version Update'
      description: 'Update semantic versions'
      enabled: true
      dependencies:
        - step_03

    - id: step_18
      name: 'Debugging Analysis'
      description: 'AI-powered debugging analysis'
      enabled: true
      dependencies:
        - step_16

    - id: step_19
      name: 'TypeScript Review'
      description: 'AI-powered TypeScript review'
      enabled: true
      dependencies:
        - step_18

    - id: step_20
      name: 'Async Performance Review'
      description: 'AI-powered async performance review'
      enabled: true
      dependencies:
        - step_19

    - id: step_22
      name: 'Accessibility Review'
      description: 'AI-powered WCAG accessibility review'
      enabled: true
      dependencies:
        - step_21

    - id: step_23
      name: 'Performance Review'
      description: 'AI-powered performance review'
      enabled: true
      dependencies:
        - step_22

    - id: step_17
      name: 'Workflow Summary'
      description: 'Generate workflow summary report'
      enabled: true
      dependencies:
        - step_03
        - step_11_6
        - step_20
        - step_23

    - id: step_0f
      name: 'Commit Artifacts'
      description: 'Commit workflow artifacts generated during the run'
      enabled: true
      dependencies:
        - step_17

    - id: step_12
      name: 'Git Finalization'
      description: 'Stage, commit and push all modifications'
      enabled: true
      dependencies:
        - step_0f
