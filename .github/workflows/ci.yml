name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Change impact analysis job
  analyze-changes:
    name: Analyze Changes
    runs-on: ubuntu-latest
    outputs:
      strategy: ${{ steps.analyze.outputs.strategy }}
      run_unit_tests: ${{ steps.analyze.outputs.run_unit_tests }}
      run_integration_tests: ${{ steps.analyze.outputs.run_integration_tests }}
      run_linting: ${{ steps.analyze.outputs.run_linting }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for accurate diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Analyze change impact
        id: analyze
        run: |
          set -e
          # Run change impact analysis
          ANALYSIS=$(node scripts/analyze-change-impact.js --json)

          # Extract decisions
          STRATEGY=$(echo "$ANALYSIS" | jq -r '.strategy')
          RUN_UNIT=$(echo "$ANALYSIS" | jq -r '.steps["unit-tests"].shouldRun // true')
          RUN_INTEGRATION=$(echo "$ANALYSIS" | jq -r '.steps["integration-tests"].shouldRun // true')
          RUN_LINTING=$(echo "$ANALYSIS" | jq -r '.steps.linting.shouldRun // true')

          # Set outputs
          echo "strategy=$STRATEGY" >> $GITHUB_OUTPUT
          echo "run_unit_tests=$RUN_UNIT" >> $GITHUB_OUTPUT
          echo "run_integration_tests=$RUN_INTEGRATION" >> $GITHUB_OUTPUT
          echo "run_linting=$RUN_LINTING" >> $GITHUB_OUTPUT

          # Show human-readable analysis
          echo "::notice::Change Impact Strategy: $STRATEGY"
          node scripts/analyze-change-impact.js --verbose

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: analyze-changes
    if: needs.analyze-changes.outputs.run_unit_tests == 'true'

    strategy:
      matrix:
        node-version: [20.x, 22.x]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Cache node_modules for 60% faster CI runs
      - name: Cache node modules
        uses: actions/cache@v3
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Verify installation even if cached
      - name: Verify installation
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Run linter
        run: npm run lint

      - name: Run fast tests (unit)
        run: npm run test:fast -- --maxWorkers=2
        timeout-minutes: 5

      - name: Test summary
        if: always()
        run: |
          echo "### Fast Test Results :zap:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Node version: ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
          echo "Test Type: Unit Tests (Fast)" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  integration-tests:
    name: Integration Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    # Run if change analysis says so AND (main branch OR PRs targeting main)
    if: |
      needs.analyze-changes.outputs.run_integration_tests == 'true' &&
      (github.ref == 'refs/heads/main' || github.base_ref == 'main')
    needs: [analyze-changes, test]
    strategy:
      matrix:
        node-version: [20.x, 22.x]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run slow tests (integration + coverage)
        run: npm run test:slow -- --maxWorkers=2
        timeout-minutes: 30

      - name: Test summary
        if: always()
        run: |
          echo "### Integration Test Results :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Node version: ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
          echo "Test Type: Integration Tests (Slow)" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-20.x-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-20.x-
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate coverage report
        run: npm run test:coverage -- --maxWorkers=2

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json,./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Coverage summary
        run: |
          set -e
          echo "### Coverage Report :bar_chart:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage reports uploaded to Codecov" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(node -e "const s=require('./coverage/coverage-summary.json').total; console.log(s.lines.pct + '%')")
            STMTS=$(node -e "const s=require('./coverage/coverage-summary.json').total; console.log(s.statements.pct + '%')")
            FUNCS=$(node -e "const s=require('./coverage/coverage-summary.json').total; console.log(s.functions.pct + '%')")
            BRANCHES=$(node -e "const s=require('./coverage/coverage-summary.json').total; console.log(s.branches.pct + '%')")
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
            echo "| Lines | $LINES |" >> $GITHUB_STEP_SUMMARY
            echo "| Statements | $STMTS |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions | $FUNCS |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | $BRANCHES |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report not available" >> $GITHUB_STEP_SUMMARY
          fi

  lint-staged:
    name: Lint Staged Files
    runs-on: ubuntu-latest
    needs: analyze-changes
    if: |
      github.event_name == 'pull_request' &&
      needs.analyze-changes.outputs.run_linting == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-20.x-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run lint-staged on changed files
        run: |
          set -e
          # Get changed files
          git diff --name-only origin/${{ github.base_ref }}..HEAD -- '*.js' '*.mjs' '*.cjs' '*.json' '*.md' '*.yaml' '*.yml' > changed_files.txt

          # Run linters on changed files only
          if [ -s changed_files.txt ]; then
            echo "Linting changed files:"
            cat changed_files.txt
            npx lint-staged --config .lintstagedrc.json
          else
            echo "No relevant files changed"
          fi

  build-check:
    name: Build & Validation Check
    runs-on: ubuntu-latest
    needs: analyze-changes
    # Always run build/validation checks (critical safety net)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-20.x-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Validate exports (prevent export mismatches)
        run: npm run validate:exports

      - name: Validate version consistency
        run: npm run validate:versions
        continue-on-error: true # Versions in CHANGELOG are expected to differ

      - name: Check for build artifacts
        run: |
          echo "### Build & Validation Check :wrench:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Project Type: ES Modules (no build required)" >> $GITHUB_STEP_SUMMARY
          echo "All source files are directly executable" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Export validation passed" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Version consistency check completed (see logs)" >> $GITHUB_STEP_SUMMARY

      - name: Verify package.json
        run: |
          node -e "
            const pkg = require('./package.json');
            console.log('Package name:', pkg.name);
            console.log('Version:', pkg.version);
            console.log('Type:', pkg.type);
            if (pkg.type !== 'module') {
              console.error('ERROR: Package type should be module');
              process.exit(1);
            }
          "

  all-checks-pass:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [analyze-changes, test, integration-tests, coverage, build-check]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          set -e
          # Integration tests and linting may be conditionally skipped
          INTEGRATION_RESULT="${{ needs.integration-tests.result }}"
          if [[ "$INTEGRATION_RESULT" == "skipped" ]]; then
            INTEGRATION_RESULT="success"
          fi

          # Coverage depends on test; treat skipped as success (e.g. docs-only changes)
          COVERAGE_RESULT="${{ needs.coverage.result }}"
          if [[ "$COVERAGE_RESULT" == "skipped" ]]; then
            COVERAGE_RESULT="success"
          fi

          # Change analysis is required
          ANALYSIS_RESULT="${{ needs.analyze-changes.result }}"

          # Unit tests are required if analysis ran
          TEST_RESULT="${{ needs.test.result }}"
          if [[ "$TEST_RESULT" == "skipped" ]]; then
            # Check if this was an intentional skip (docs-only)
            STRATEGY="${{ needs.analyze-changes.outputs.strategy }}"
            if [[ "$STRATEGY" == "docs-only" ]]; then
              TEST_RESULT="success"
            fi
          fi

          if [[ "$ANALYSIS_RESULT" == "success" && \
                "$TEST_RESULT" == "success" && \
                "$INTEGRATION_RESULT" == "success" && \
                "$COVERAGE_RESULT" == "success" && \
                "${{ needs.build-check.result }}" == "success" ]]; then
            echo "✅ All checks passed!"
            echo "Strategy: ${{ needs.analyze-changes.outputs.strategy }}"
            exit 0
          else
            echo "❌ Some checks failed"
            echo "Change Analysis: $ANALYSIS_RESULT"
            echo "Fast Tests: $TEST_RESULT"
            echo "Integration Tests: $INTEGRATION_RESULT"
            echo "Coverage: $COVERAGE_RESULT"
            echo "Build: ${{ needs.build-check.result }}"
            exit 1
          fi
