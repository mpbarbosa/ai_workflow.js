name: Coverage Comment

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage-comment:
    name: Post Coverage Comment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-20.x-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-20.x-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate coverage
        run: npm run test:coverage

      - name: Extract coverage summary
        id: coverage
        run: |
          # Extract coverage percentages from coverage summary
          STATEMENTS=$(cat coverage/coverage-summary.json | jq -r '.total.statements.pct')
          BRANCHES=$(cat coverage/coverage-summary.json | jq -r '.total.branches.pct')
          FUNCTIONS=$(cat coverage/coverage-summary.json | jq -r '.total.functions.pct')
          LINES=$(cat coverage/coverage-summary.json | jq -r '.total.lines.pct')

          echo "statements=$STATEMENTS" >> $GITHUB_OUTPUT
          echo "branches=$BRANCHES" >> $GITHUB_OUTPUT
          echo "functions=$FUNCTIONS" >> $GITHUB_OUTPUT
          echo "lines=$LINES" >> $GITHUB_OUTPUT

      - name: Comment PR with coverage
        uses: actions/github-script@v7
        with:
          script: |
            const statements = '${{ steps.coverage.outputs.statements }}';
            const branches = '${{ steps.coverage.outputs.branches }}';
            const functions = '${{ steps.coverage.outputs.functions }}';
            const lines = '${{ steps.coverage.outputs.lines }}';

            const getEmoji = (pct) => {
              if (pct >= 90) return '🟢';
              if (pct >= 80) return '🟡';
              return '🔴';
            };

            const body = `## 📊 Coverage Report

            | Metric | Coverage | Status |
            |--------|----------|--------|
            | Statements | ${statements}% | ${getEmoji(statements)} |
            | Branches | ${branches}% | ${getEmoji(branches)} |
            | Functions | ${functions}% | ${getEmoji(functions)} |
            | Lines | ${lines}% | ${getEmoji(lines)} |

            <details>
            <summary>Coverage Status Guide</summary>

            - 🟢 Excellent: ≥90%
            - 🟡 Good: 80-89%
            - 🔴 Needs Improvement: <80%

            </details>

            **Overall Coverage:** ${lines}% lines covered

            ---
            *Updated automatically by [Coverage Comment workflow](.github/workflows/coverage-comment.yml)*
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
