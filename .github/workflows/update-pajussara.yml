# update-pajussara.yml
# Checks for a new pajussara_tui_comp release on GitHub and updates the tarball
# CDN URL in package.json, installs dependencies, lints, runs tests, adjusts
# related code/docs/tests, and opens a pull request.
#
# pajussara_tui_comp is consumed via its GitHub tarball CDN — the same pattern
# used for other GitHub-hosted dependencies in this project.
#
# Triggers:
#   - Weekly schedule (Wednesday 09:00 UTC)
#   - workflow_dispatch — pin to a specific version or force a refresh

name: Update pajussara_tui_comp

on:
  schedule:
    - cron: '0 9 * * 3' # every Wednesday at 09:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: |
          pajussara_tui_comp tag to update to (e.g. v1.2.0).
          Leave blank to use the latest published release.
        required: false
        default: ''

permissions:
  contents: write # push update branch
  pull-requests: write # open / update PR

# Prevent concurrent runs from racing on the same PR branch.
# cancel-in-progress: false queues the second run rather than dropping it,
# ensuring every scheduled or manual trigger is eventually processed.
concurrency:
  group: update-pajussara-tui-comp
  cancel-in-progress: false

jobs:
  update-pajussara:
    name: Check & Update pajussara_tui_comp
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      # Submodules are not used by this workflow; omitting them avoids failures
      # caused by stale submodule commit pointers in the parent repo.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ── 2. Node.js setup ─────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: npm

      # ── 3. Resolve target version ─────────────────────────────────────────────
      - name: Resolve target pajussara_tui_comp version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"

          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION#v}"
            TAG="v${VERSION}"
            echo "Source: workflow_dispatch input"
          else
            TAG="$(gh api repos/mpbarbosa/pajussara_tui_comp/releases/latest --jq '.tag_name // empty' 2>/dev/null || true)"
            [[ "${TAG}" =~ ^v[0-9] ]] || TAG=""
            if [[ -n "${TAG}" ]]; then
              echo "Source: GitHub latest release"
            else
              TAG="$(gh api repos/mpbarbosa/pajussara_tui_comp/tags --jq '.[0].name' 2>/dev/null || true)"
              [[ -n "${TAG}" ]] || { echo "❌  Could not determine latest pajussara_tui_comp tag." >&2; exit 1; }
              echo "Source: GitHub latest tag (no published release)"
            fi
            VERSION="${TAG#v}"
          fi

          TARBALL_URL="https://github.com/mpbarbosa/pajussara_tui_comp/archive/refs/tags/${TAG}.tar.gz"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "tarball_url=${TARBALL_URL}" >> "$GITHUB_OUTPUT"
          echo "ℹ️  Target: pajussara_tui_comp ${TAG}"
          echo "ℹ️  Tarball: ${TARBALL_URL}"

      # ── 4. Check current version ──────────────────────────────────────────────
      - name: Check current pajussara_tui_comp version in package.json
        id: current
        run: |
          CURRENT_URL="$(node -e "
          const pkg = require('./package.json');
          process.stdout.write(pkg.dependencies?.['pajussara_tui_comp'] ?? '');
          ")"
          echo "current_url=${CURRENT_URL}" >> "$GITHUB_OUTPUT"

          TARGET_URL="${{ steps.resolve.outputs.tarball_url }}"

          if [[ "${CURRENT_URL}" == "${TARGET_URL}" ]]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "✅  pajussara_tui_comp is already at ${{ steps.resolve.outputs.tag }} — nothing to do."
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            if [[ -z "${CURRENT_URL}" ]]; then
              echo "ℹ️  pajussara_tui_comp is not yet a dependency — will add it."
            else
              echo "ℹ️  Updating pajussara_tui_comp:  ${CURRENT_URL}  →  ${TARGET_URL}"
            fi
          fi

      # ── 5. Update package.json ────────────────────────────────────────────────
      - name: Update pajussara_tui_comp in package.json
        if: steps.current.outputs.up_to_date != 'true'
        env:
          TARGET_URL: ${{ steps.resolve.outputs.tarball_url }}
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies = pkg.dependencies || {};
          pkg.dependencies['pajussara_tui_comp'] = process.env.TARGET_URL;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          console.log('✅  package.json updated.');
          "

      # ── 6. Install & lock ─────────────────────────────────────────────────────
      # npm install with the explicit tarball URL adds (or updates) pajussara_tui_comp
      # and regenerates only the affected lock-file entries, leaving all other
      # dependency ranges untouched.
      #
      # Before installing, clear stale integrity hashes for all GitHub tarball
      # dependencies — their tarballs can change without a tag change, causing
      # EINTEGRITY failures even for packages unrelated to pajussara_tui_comp.
      - name: Install dependencies (targeted update)
        if: steps.current.outputs.up_to_date != 'true'
        run: |
          node -e "
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          let cleared = 0;
          for (const [, pkg] of Object.entries(lock.packages || {})) {
            if (pkg.resolved && pkg.resolved.includes('github.com') && pkg.resolved.includes('.tar.gz') && pkg.integrity) {
              delete pkg.integrity;
              cleared++;
            }
          }
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          console.log('Cleared stale integrity for ' + cleared + ' GitHub tarball package(s).');
          "
          npm install "pajussara_tui_comp@${{ steps.resolve.outputs.tarball_url }}"

      # ── 7. Lint ───────────────────────────────────────────────────────────────
      - name: Lint (ESLint)
        if: steps.current.outputs.up_to_date != 'true'
        run: npm run lint

      # ── 8. Tests ──────────────────────────────────────────────────────────────
      - name: Run unit & integration tests
        if: steps.current.outputs.up_to_date != 'true'
        run: npm test

      # ── 9. Adjust pajussara_tui_comp related code ─────────────────────────────
      # Scans src/**/*.js for pajussara_tui_comp imports and updates any
      # hardcoded version strings from the old tag to the new one, then
      # re-lints the affected files.
      - name: Adjust pajussara_tui_comp related code
        if: steps.current.outputs.up_to_date != 'true'
        run: |
          NEW_VERSION="${{ steps.resolve.outputs.version }}"
          OLD_URL="${{ steps.current.outputs.current_url }}"

          OLD_VERSION=""
          if [[ -n "${OLD_URL}" ]]; then
            OLD_VERSION="$(echo "${OLD_URL}" | sed 's|.*/tags/v||; s|\.tar\.gz||')"
          fi

          echo "ℹ️  Scanning src/ for pajussara_tui_comp imports and version strings…"

          mapfile -t CODE_FILES < <(grep -rl \
            "pajussara_tui_comp\|pajussara-tui-comp\|from 'pajussara\|from \"pajussara" \
            src/ 2>/dev/null || true)

          if [[ ${#CODE_FILES[@]} -eq 0 ]]; then
            echo "ℹ️  No pajussara_tui_comp references found in src/ — nothing to adjust."
          else
            echo "📄  Files with pajussara_tui_comp references: ${CODE_FILES[*]}"

            if [[ -n "${OLD_VERSION}" && "${OLD_VERSION}" != "${NEW_VERSION}" ]]; then
              for f in "${CODE_FILES[@]}"; do
                sed -i "s|${OLD_VERSION}|${NEW_VERSION}|g" "${f}"
                echo "   ✏️  Updated version string in ${f}"
              done
            fi
          fi

          echo "🔍  Re-running lint…"
          npm run lint
          echo "✅  Lint passed after code adjustment."

      # ── 10. Update pajussara_tui_comp related documentation ───────────────────
      # Replaces the old pajussara_tui_comp tarball URL and version tag in all
      # Markdown files so that CDN snippets and version badges stay accurate.
      - name: Update pajussara_tui_comp related documentation
        if: steps.current.outputs.up_to_date != 'true'
        run: |
          NEW_VERSION="${{ steps.resolve.outputs.version }}"
          NEW_URL="${{ steps.resolve.outputs.tarball_url }}"
          OLD_URL="${{ steps.current.outputs.current_url }}"

          OLD_VERSION=""
          if [[ -n "${OLD_URL}" ]]; then
            OLD_VERSION="$(echo "${OLD_URL}" | sed 's|.*/tags/v||; s|\.tar\.gz||')"
          fi

          echo "ℹ️  Scanning docs/ and root Markdown files for pajussara_tui_comp references…"

          mapfile -t DOC_FILES < <(find . -name '*.md' \
            ! -path './node_modules/*' \
            ! -path './.ai_workflow/*' \
            -print 2>/dev/null || true)

          UPDATED=0
          for f in "${DOC_FILES[@]}"; do
            if grep -q "pajussara_tui_comp\|pajussara-tui-comp" "${f}" 2>/dev/null; then
              if [[ -n "${OLD_URL}" ]]; then
                sed -i "s|${OLD_URL}|${NEW_URL}|g" "${f}"
              fi
              if [[ -n "${OLD_VERSION}" && "${OLD_VERSION}" != "${NEW_VERSION}" ]]; then
                grep -n "pajussara" "${f}" | grep -q "${OLD_VERSION}" && \
                  sed -i "/pajussara/s|${OLD_VERSION}|${NEW_VERSION}|g" "${f}" || true
              fi
              echo "   ✏️  Updated: ${f}"
              UPDATED=$((UPDATED + 1))
            fi
          done

          if [[ ${UPDATED} -eq 0 ]]; then
            echo "ℹ️  No pajussara_tui_comp references found in documentation — nothing to update."
          else
            echo "✅  Updated ${UPDATED} documentation file(s)."
          fi

      # ── 11. Adjust pajussara_tui_comp related tests ───────────────────────────
      # Finds test files that import or mock pajussara_tui_comp, applies version-
      # string replacement, then re-runs only those test files.
      - name: Adjust pajussara_tui_comp related tests
        if: steps.current.outputs.up_to_date != 'true'
        run: |
          NEW_VERSION="${{ steps.resolve.outputs.version }}"
          OLD_URL="${{ steps.current.outputs.current_url }}"

          OLD_VERSION=""
          if [[ -n "${OLD_URL}" ]]; then
            OLD_VERSION="$(echo "${OLD_URL}" | sed 's|.*/tags/v||; s|\.tar\.gz||')"
          fi

          echo "ℹ️  Scanning test/ and __tests__/ for pajussara_tui_comp references…"

          mapfile -t TEST_FILES < <(grep -rl \
            "pajussara_tui_comp\|pajussara-tui-comp\|from 'pajussara\|from \"pajussara" \
            test/ __tests__/ 2>/dev/null || true)

          if [[ ${#TEST_FILES[@]} -eq 0 ]]; then
            echo "ℹ️  No pajussara_tui_comp references found in test files — nothing to adjust."
          else
            echo "📄  Test files with pajussara_tui_comp references: ${TEST_FILES[*]}"

            if [[ -n "${OLD_VERSION}" && "${OLD_VERSION}" != "${NEW_VERSION}" ]]; then
              for f in "${TEST_FILES[@]}"; do
                sed -i "s|${OLD_VERSION}|${NEW_VERSION}|g" "${f}"
                echo "   ✏️  Updated version string in ${f}"
              done
            fi

            echo "🧪  Re-running affected test files…"
            node --experimental-vm-modules node_modules/jest/bin/jest.js --passWithNoTests "${TEST_FILES[@]}"
            echo "✅  Affected tests passed after adjustment."
          fi

      # ── 12. Open pull request ─────────────────────────────────────────────────
      - name: Create pull request
        if: steps.current.outputs.up_to_date != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-pajussara-tui-comp-${{ steps.resolve.outputs.version }}
          delete-branch: true
          commit-message: |
            chore(deps): update pajussara_tui_comp to ${{ steps.resolve.outputs.tag }}

            Update pajussara_tui_comp tarball CDN URL to ${{ steps.resolve.outputs.tag }}.
            URL: ${{ steps.resolve.outputs.tarball_url }}
          title: 'chore(deps): update pajussara_tui_comp to ${{ steps.resolve.outputs.tag }}'
          body: |
            ## pajussara_tui_comp → ${{ steps.resolve.outputs.tag }}

            Updates the `pajussara_tui_comp` dependency tarball CDN URL to the latest release.

            | | |
            |---|---|
            | **Previous** | `${{ steps.current.outputs.current_url }}` |
            | **New** | `${{ steps.resolve.outputs.tarball_url }}` |

            ### Checks
            - [x] ESLint (`npm run lint`)
            - [x] Unit & integration tests
            - [x] pajussara_tui_comp related code adjusted (version strings in `src/` updated, lint re-run)
            - [x] pajussara_tui_comp related documentation updated (CDN URLs and version tags in `docs/` and root Markdown files)
            - [x] pajussara_tui_comp related tests adjusted (version strings in `test/` updated, affected tests re-run)

            > Triggered by: `${{ github.event_name }}`
          labels: dependencies
